<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>袁周率抓周紀錄 — 周筠 YUN</title>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@300;400&family=Noto+Sans+TC:wght@300;400&family=Cormorant+Garamond:ital,wght@1,300&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root { --bg: #F8F5F0; --dark2: #141E1B; --morandi: #8BA5B3; --cream: #E8E4DC; }
    body { background: var(--bg); font-family: 'Noto Sans TC', sans-serif; }
    #nav { position: fixed; top: 0; left: 0; right: 0; z-index: 500; display: flex; align-items: center; justify-content: space-between; padding: 0 60px; height: 64px; background: rgba(20,30,27,0.96); backdrop-filter: blur(12px); border-bottom: 1px solid rgba(139,165,179,0.12); }
    .nav-logo { display: flex; align-items: baseline; gap: 10px; text-decoration: none; }
    .nav-logo-zh { font-family: 'Noto Serif TC', serif; font-size: 16px; font-weight: 400; letter-spacing: 0.12em; color: var(--cream); }
    .nav-logo-en { font-family: 'Cormorant Garamond', serif; font-style: italic; font-size: 20px; letter-spacing: 0.18em; color: var(--morandi); }
    .nav-back { font-size: 12px; letter-spacing: 0.1em; color: rgba(232,228,220,0.55); text-decoration: none; transition: color 0.2s; }
    .nav-back:hover { color: var(--cream); }
    .page-header { padding: 112px 60px 40px; text-align: center; }
    .page-header .eyebrow { font-size: 10px; letter-spacing: 0.45em; color: var(--morandi); margin-bottom: 14px; }
    .page-header h1 { font-family: 'Noto Serif TC', serif; font-size: 26px; font-weight: 300; letter-spacing: 0.1em; color: #1C1C1C; }
    .gallery-grid { max-width: 1280px; margin: 0 auto; padding: 0 60px 100px; display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px; }
    .grid-photo { width: 100%; aspect-ratio: 3/2; object-fit: cover; display: block; cursor: pointer; transition: opacity 0.3s; }
    .grid-photo:hover { opacity: 0.86; }
    footer { background: var(--dark2); padding: 28px 60px; text-align: center; }
    footer p { font-size: 11px; letter-spacing: 0.2em; color: rgba(232,228,220,0.22); }
    #lightbox { display: none; position: fixed; inset: 0; background: rgba(20,30,27,0.97); z-index: 9999; align-items: center; justify-content: center; }
    #lightbox.open { display: flex; }
    #lb-img { max-width: 92vw; max-height: 92vh; object-fit: contain; }
    .lb-close { position: fixed; top: 22px; right: 30px; background: none; border: none; color: rgba(232,228,220,0.5); font-size: 28px; cursor: pointer; }
    .lb-close:hover { color: var(--cream); }
    .lb-prev, .lb-next { position: fixed; top: 50%; transform: translateY(-50%); background: none; border: none; color: rgba(232,228,220,0.4); font-size: 56px; cursor: pointer; transition: color 0.2s; }
    .lb-prev { left: 20px; } .lb-next { right: 20px; }
    .lb-prev:hover, .lb-next:hover { color: var(--cream); }
    #lb-counter { position: fixed; bottom: 22px; left: 50%; transform: translateX(-50%); font-size: 11px; letter-spacing: 0.22em; color: rgba(232,228,220,0.32); }
    @media (max-width: 768px) {
      #nav { padding: 0 20px; }
      .page-header { padding: 90px 20px 28px; }
      .gallery-grid { grid-template-columns: repeat(2, 1fr); padding: 0 20px 60px; }
    }
  </style>
</head>
<body>
  <nav id="nav">
    <a class="nav-logo" href="index.html"><span class="nav-logo-zh">周筠</span><span class="nav-logo-en">YUN</span></a>
    <a class="nav-back" href="baby.html">← 抓周攝影</a>
  </nav>
  <div class="page-header">
    <p class="eyebrow">2026 · 07 · 19</p>
    <h1>袁周率抓周紀錄</h1>
  </div>
  <div class="gallery-grid">
    <img class="grid-photo" src="images/baby/yuanzhoulu/cover.jpg" alt="" data-index="0">
    <img class="grid-photo" src="images/baby/yuanzhoulu/YUN00107.jpg" alt="" data-index="1">
  </div>
  <footer><p>© 2026 周筠 YUN · 攝影師 × 燈光設計師 · 台北萬華</p></footer>
  <div id="lightbox">
    <button class="lb-close">✕</button>
    <button class="lb-prev">‹</button>
    <img id="lb-img" src="" alt="">
    <button class="lb-next">›</button>
    <div id="lb-counter"></div>
  </div>
  <script>
    const PHOTOS = [
      'images/baby/yuanzhoulu/cover.jpg',
      'images/baby/yuanzhoulu/YUN00107.jpg',
    ]
    const lb = document.getElementById('lightbox')
    const lbImg = document.getElementById('lb-img')
    const lbCtr = document.getElementById('lb-counter')
    let idx = 0
    function lbOpen(i) { idx=i; lbImg.src=PHOTOS[idx]; lbCtr.textContent=`${idx+1} / ${PHOTOS.length}`; lb.classList.add('open'); document.body.style.overflow='hidden' }
    function lbClose() { lb.classList.remove('open'); document.body.style.overflow='' }
    function lbStep(d) { idx=(idx+d+PHOTOS.length)%PHOTOS.length; lbImg.src=PHOTOS[idx]; lbCtr.textContent=`${idx+1} / ${PHOTOS.length}` }
    document.querySelectorAll('.grid-photo').forEach(img => img.addEventListener('click', () => lbOpen(parseInt(img.dataset.index))))
    document.querySelector('.lb-close').addEventListener('click', lbClose)
    document.querySelector('.lb-prev').addEventListener('click', e => { e.stopPropagation(); lbStep(-1) })
    document.querySelector('.lb-next').addEventListener('click', e => { e.stopPropagation(); lbStep(1) })
    lb.addEventListener('click', e => { if(e.target===lb) lbClose() })
    document.addEventListener('keydown', e => { if(!lb.classList.contains('open')) return; if(e.key==='Escape') lbClose(); if(e.key==='ArrowLeft') lbStep(-1); if(e.key==='ArrowRight') lbStep(1) })
  </script>
</body>
</html>
