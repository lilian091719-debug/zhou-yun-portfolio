    const lb=document.getElementById('lightbox'),lbImg=document.getElementById('lb-img'),lbCtr=document.getElementById('lb-counter');let idx=0
    function lbOpen(i){idx=i;lbImg.src=PHOTOS[idx];lbCtr.textContent=`${idx+1} / ${PHOTOS.length}`;lb.classList.add('open');document.body.style.overflow='hidden'}
    function lbClose(){lb.classList.remove('open');document.body.style.overflow=''}
    function lbStep(d){idx=(idx+d+PHOTOS.length)%PHOTOS.length;lbImg.src=PHOTOS[idx];lbCtr.textContent=`${idx+1} / ${PHOTOS.length}`}
    document.querySelectorAll('.grid-photo').forEach(img=>img.addEventListener('click',()=>lbOpen(parseInt(img.dataset.index))))
    document.querySelector('.lb-close').addEventListener('click',lbClose)
    document.querySelector('.lb-prev').addEventListener('click',e=>{e.stopPropagation();lbStep(-1)})
    document.querySelector('.lb-next').addEventListener('click',e=>{e.stopPropagation();lbStep(1)})
    lb.addEventListener('click',e=>{if(e.target===lb)lbClose()})
    document.addEventListener('keydown',e=>{if(!lb.classList.contains('open'))return;if(e.key==='Escape')lbClose();if(e.key==='ArrowLeft')lbStep(-1);if(e.key==='ArrowRight')lbStep(1)})
