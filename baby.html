  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #F8F5F0; --dark: #1A2620; --dark2: #141E1B;
      --morandi: #8BA5B3; --cream: #E8E4DC; --muted: #7A7265;
      --border: rgba(139,165,179,0.18);
    }
    html { scroll-behavior: smooth; }
    body { background: var(--bg); font-family: 'Noto Sans TC', sans-serif; }

    /* NAV */
    #nav {
      position: fixed; top: 0; left: 0; right: 0; z-index: 500;
      display: flex; align-items: center; justify-content: space-between;
      padding: 0 60px; height: 64px;
      background: rgba(20,30,27,0.96); backdrop-filter: blur(12px);
      border-bottom: 1px solid rgba(139,165,179,0.12);
    }
    .nav-logo { display: flex; align-items: baseline; gap: 10px; text-decoration: none; }
    .nav-logo-zh { font-family: 'Noto Serif TC', serif; font-size: 16px; font-weight: 400; letter-spacing: 0.12em; color: var(--cream); }
    .nav-logo-en { font-family: 'Cormorant Garamond', serif; font-style: italic; font-size: 20px; letter-spacing: 0.18em; color: var(--morandi); }
    .nav-menu { display: flex; align-items: center; gap: 28px; list-style: none; }
    .nav-item > a { font-size: 12px; letter-spacing: 0.1em; color: rgba(232,228,220,0.65); text-decoration: none; transition: color 0.22s; padding: 22px 0; display: block; }
    .nav-item > a:hover { color: var(--cream); }
    .has-drop > a::after { content: ' ▾'; font-size: 8px; opacity: 0.6; }
    .nav-dropdown { position: absolute; top: 100%; left: 50%; transform: translateX(-50%) translateY(6px); background: var(--dark2); border: 1px solid rgba(139,165,179,0.12); border-radius: 3px; min-width: 200px; padding: 8px 0; opacity: 0; visibility: hidden; transition: opacity 0.2s, transform 0.2s, visibility 0.2s; white-space: nowrap; }
    .has-drop:hover .nav-dropdown { opacity: 1; visibility: visible; transform: translateX(-50%) translateY(0); }
    .nav-item { position: relative; }
    .nav-dropdown a { display: block; padding: 10px 22px; font-size: 12px; letter-spacing: 0.06em; color: rgba(232,228,220,0.55); text-decoration: none; transition: color 0.18s, background 0.18s; }
    .nav-dropdown a:hover { color: var(--cream); background: rgba(139,165,179,0.08); }

    /* HEADER */
    .page-header { padding: 112px 60px 48px; text-align: center; }
    .page-header .eyebrow { font-size: 10px; letter-spacing: 0.45em; color: var(--morandi); margin-bottom: 14px; }
    .page-header h1 { font-family: 'Noto Serif TC', serif; font-size: 30px; font-weight: 300; letter-spacing: 0.1em; color: #1C1C1C; }

    /* ALBUM GRID */
    .album-grid {
      max-width: 1280px; margin: 0 auto;
      padding: 0 60px 100px;
      display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px;
    }
    .album-card { position: relative; overflow: hidden; text-decoration: none; display: block; aspect-ratio: 3/2; }
    .album-card img { width: 100%; height: 100%; object-fit: cover; transition: transform 0.6s ease; display: block; }
    .album-card:hover img { transform: scale(1.05); }

    /* FOOTER */
    footer { background: var(--dark2); padding: 28px 60px; text-align: center; }
    footer p { font-size: 11px; letter-spacing: 0.2em; color: rgba(232,228,220,0.22); }

    @media (max-width: 768px) {
      #nav { padding: 0 20px; }
      .nav-menu { display: none; }
      .page-header { padding: 90px 20px 32px; }
      .album-grid { grid-template-columns: repeat(2, 1fr); padding: 0 20px 60px; }
    }
  </style>
</head>
