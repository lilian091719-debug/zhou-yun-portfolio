<html lang="zh-TW">
<head>

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:      #F8F5F0;
      --dark:    #1A2620;
      --dark2:   #141E1B;
      --morandi: #8BA5B3;
      --cream:   #E8E4DC;
      --muted:   #7A7265;
      --border:  rgba(139,165,179,0.18);
    }

    html { scroll-behavior: smooth; }
    body { background: var(--bg); font-family: 'Noto Sans TC', sans-serif; }

    /* ── NAV ── */
    #nav {
      position: fixed; top: 0; left: 0; right: 0; z-index: 500;
      display: flex; align-items: center; justify-content: space-between;
      padding: 0 60px; height: 64px;
      background: rgba(20,30,27,0.96);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid rgba(139,165,179,0.12);
    }
    .nav-logo {
      display: flex; align-items: baseline; gap: 10px; text-decoration: none;
    }
    .nav-logo-zh {
      font-family: 'Noto Serif TC', serif;
      font-size: 16px; font-weight: 400; letter-spacing: 0.12em; color: var(--cream);
    }
    .nav-logo-en {
      font-family: 'Cormorant Garamond', serif;
      font-style: italic; font-size: 20px; letter-spacing: 0.18em; color: var(--morandi);
    }
    .nav-menu { display: flex; align-items: center; gap: 28px; list-style: none; }
    .nav-item { position: relative; }
    .nav-item > a {
      font-size: 12px; letter-spacing: 0.1em;
      color: rgba(232,228,220,0.65); text-decoration: none;
      transition: color 0.22s; padding: 22px 0; display: block;
    }
    .nav-item > a:hover { color: var(--cream); }
    .has-drop > a::after { content: ' ▾'; font-size: 8px; opacity: 0.6; }
    .nav-dropdown {
      position: absolute; top: 100%; left: 50%;
      transform: translateX(-50%) translateY(6px);
      background: var(--dark2);
      border: 1px solid rgba(139,165,179,0.12);
      border-radius: 3px; min-width: 200px; padding: 8px 0;
      opacity: 0; visibility: hidden;
      transition: opacity 0.2s, transform 0.2s, visibility 0.2s;
      white-space: nowrap;
    }
    .has-drop:hover .nav-dropdown { opacity: 1; visibility: visible; transform: translateX(-50%) translateY(0); }
    .nav-dropdown a {
      display: block; padding: 10px 22px;
      font-size: 12px; letter-spacing: 0.06em;
      color: rgba(232,228,220,0.55); text-decoration: none;
      transition: color 0.18s, background 0.18s;
    }
    .nav-dropdown a:hover { color: var(--cream); background: rgba(139,165,179,0.08); }

    /* ── HEADER ── */
    .page-header {
      padding: 120px 60px 48px;
      text-align: center;
    }
    .page-header .eyebrow {
      font-size: 10px; letter-spacing: 0.45em;
      color: var(--morandi); margin-bottom: 16px;
    }
    .page-header h1 {
      font-family: 'Noto Serif TC', serif;
      font-size: 32px; font-weight: 300; letter-spacing: 0.1em;
      color: #1C1C1C;
    }

    /* ── COVER ── */
    .cover-wrap {
      max-width: 1280px; margin: 0 auto 4px; padding: 0 60px;
    }
    .cover-img {
      width: 100%; aspect-ratio: 16/9; object-fit: cover;
      display: block; cursor: pointer;
      transition: opacity 0.3s;
    }
    .cover-img:hover { opacity: 0.88; }

    /* ── GRID ── */
    .gallery-grid {
      max-width: 1280px; margin: 0 auto;
      padding: 0 60px 80px;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 4px;
    }
    .grid-photo {
      width: 100%; aspect-ratio: 3/2; object-fit: cover;
      display: block; cursor: pointer;
      transition: opacity 0.3s;
    }
    .grid-photo:hover { opacity: 0.86; }

    /* ── FOOTER ── */
    footer {
      background: var(--dark2); padding: 28px 60px; text-align: center;
    }
    footer p { font-size: 11px; letter-spacing: 0.2em; color: rgba(232,228,220,0.22); }

    /* ── LIGHTBOX ── */
    #lightbox {
      display: none; position: fixed; inset: 0;
      background: rgba(20,30,27,0.97); z-index: 9999;
      align-items: center; justify-content: center;
    }
    #lightbox.open { display: flex; }
    #lb-img { max-width: 92vw; max-height: 92vh; object-fit: contain; }
    .lb-close {
      position: fixed; top: 22px; right: 30px;
      background: none; border: none; color: rgba(232,228,220,0.5);
      font-size: 28px; cursor: pointer; transition: color 0.2s;
    }
    .lb-close:hover { color: var(--cream); }
    .lb-prev, .lb-next {
      position: fixed; top: 50%; transform: translateY(-50%);
      background: none; border: none;
      color: rgba(232,228,220,0.4); font-size: 56px; cursor: pointer;
      transition: color 0.2s;
    }
    .lb-prev { left: 20px; }
    .lb-next { right: 20px; }
    .lb-prev:hover, .lb-next:hover { color: var(--cream); }
    #lb-counter {
      position: fixed; bottom: 22px; left: 50%; transform: translateX(-50%);
      font-size: 11px; letter-spacing: 0.22em;
      color: rgba(232,228,220,0.32);
    }

    /* mobile */
    @media (max-width: 768px) {
      #nav { padding: 0 20px; }
      .nav-menu { display: none; }
      .page-header { padding: 90px 20px 32px; }
      .cover-wrap { padding: 0 20px; }
      .gallery-grid { grid-template-columns: repeat(2, 1fr); padding: 0 20px 60px; }
    }
  </style>
</head>

  </div>

  <script>
    const ALL_PHOTOS = [
      'images/baby/cover.jpg',
      'images/baby/20260125_lukas抓周紀錄_010.jpg',
      'images/baby/20260125_lukas抓周紀錄_023.jpg',
      'images/baby/20260125_lukas抓周紀錄_026.jpg',
      'images/baby/20260125_lukas抓周紀錄_035.jpg',
      'images/baby/20260125_lukas抓周紀錄_037.jpg',
      'images/baby/20260125_lukas抓周紀錄_043.jpg',
      'images/baby/20260125_lukas抓周紀錄_044.jpg',
      'images/baby/20260125_lukas抓周紀錄_046.jpg',
      'images/baby/20260125_lukas抓周紀錄_071.jpg',
      'images/baby/20260125_lukas抓周紀錄_074.jpg',
      'images/baby/20260125_lukas抓周紀錄_078.jpg',
      'images/baby/20260125_lukas抓周紀錄_091.jpg',
      'images/baby/20260125_lukas抓周紀錄_099.jpg',
      'images/baby/20260125_lukas抓周紀錄_103.jpg',
      'images/baby/20260125_lukas抓周紀錄_119.jpg',
      'images/baby/20260125_lukas抓周紀錄_126.jpg',
      'images/baby/20260125_lukas抓周紀錄_129.jpg',
    ]

    const lb = document.getElementById('lightbox')
    const lbImg = document.getElementById('lb-img')
    const lbCtr = document.getElementById('lb-counter')
    let idx = 0

    function lbOpen(i) {
      idx = i
      lbImg.src = ALL_PHOTOS[idx]
      lbCtr.textContent = `${idx + 1} / ${ALL_PHOTOS.length}`
      lb.classList.add('open')
      document.body.style.overflow = 'hidden'
    }
    function lbClose() { lb.classList.remove('open'); document.body.style.overflow = '' }
    function lbStep(d) {
      idx = (idx + d + ALL_PHOTOS.length) % ALL_PHOTOS.length
      lbImg.src = ALL_PHOTOS[idx]
      lbCtr.textContent = `${idx + 1} / ${ALL_PHOTOS.length}`
    }

    document.querySelectorAll('.cover-img, .grid-photo').forEach(img => {
      img.addEventListener('click', () => lbOpen(parseInt(img.dataset.index)))
    })
    document.querySelector('.lb-close').addEventListener('click', lbClose)
    document.querySelector('.lb-prev').addEventListener('click', e => { e.stopPropagation(); lbStep(-1) })
    document.querySelector('.lb-next').addEventListener('click', e => { e.stopPropagation(); lbStep(1) })
    lb.addEventListener('click', e => { if (e.target === lb) lbClose() })
    document.addEventListener('keydown', e => {
      if (!lb.classList.contains('open')) return
      if (e.key === 'Escape') lbClose()
      if (e.key === 'ArrowLeft') lbStep(-1)
      if (e.key === 'ArrowRight') lbStep(1)
    })
  </script>
